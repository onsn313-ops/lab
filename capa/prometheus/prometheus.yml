global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Kafka Broker JMX Metrics (브로커 1)
  - job_name: 'kafka-broker-1'
    static_configs:
      - targets: ['kafka-1:7071']
        labels:
          broker: 'kafka-1'

  # Kafka Broker JMX Metrics (브로커 2)
  - job_name: 'kafka-broker-2'
    static_configs:
      - targets: ['kafka-2:7072']
        labels:
          broker: 'kafka-2'

  # Kafka Broker JMX Metrics (브로커 3)
  - job_name: 'kafka-broker-3'
    static_configs:
      - targets: ['kafka-3:7073']
        labels:
          broker: 'kafka-3'

  # Kafka Exporter (Consumer Lag 등)
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
