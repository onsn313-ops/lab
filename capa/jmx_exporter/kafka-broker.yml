lowercaseOutputName: true
lowercaseOutputLabelNames: true

whitelistObjectNames:
  - kafka.server:type=BrokerTopicMetrics,name=*
  - kafka.server:type=BrokerTopicMetrics,name=*,topic=*
  - kafka.server:type=ReplicaManager,name=*
  - kafka.server:type=KafkaRequestHandlerPool,name=*
  - kafka.network:type=RequestMetrics,name=*,request=*
  - kafka.network:type=Processor,name=*,networkProcessor=*
  - kafka.controller:type=KafkaController,name=*
  - kafka.server:type=ReplicaFetcherManager,name=*,clientId=*
  - kafka.server:type=DelayedOperationPurgatory,name=*,delayedOperation=*
  - kafka.server:type=FetcherLagMetrics,name=*,clientId=*,topic=*,partition=*
  - kafka.log:type=LogFlushStats,name=*
  - kafka.log:type=Log,name=*,topic=*,partition=*
  - kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec
  - kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec,topic=*
  - kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec
  - kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec,topic=*  
  - kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec
  - kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec,topic=*
  - java.lang:type=OperatingSystem
  - java.lang:type=Memory
  - java.lang:type=GarbageCollector,name=*
  - java.lang:type=Threading

rules:
  # 토픽별 BrokerTopicMetrics (가장 먼저 매칭되어야 함)
  - pattern: kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec), topic=(.+)><>Count
    name: kafka_server_BrokerTopicMetrics_$1_Count
    type: COUNTER
    labels:
      topic: "$2"
  
  # 전체 합계 BrokerTopicMetrics (topic 레이블 없음)
  - pattern: kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec)><>Count
    name: kafka_server_BrokerTopicMetrics_$1_Total_Count
    type: COUNTER

  # Replica Fetcher Lag (복제 지연)
  - pattern: kafka.server<type=FetcherLagMetrics, name=ConsumerLag, clientId=(.+), topic=(.+), partition=(.+)><>Value
    name: kafka_server_FetcherLagMetrics_ConsumerLag
    type: GAUGE
    labels:
      clientId: "$1"
      topic: "$2"
      partition: "$3"

  - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
    name: kafka_server_$1_$2
    type: GAUGE
    labels:
      clientId: "$3"
      topic: "$4"
      partition: "$5"
  
  - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
    name: kafka_server_$1_$2
    type: GAUGE
    labels:
      clientId: "$3"
      broker: "$4:$5"
  
  - pattern: kafka.server<type=(.+), name=(.+)><>Value
    name: kafka_server_$1_$2
    type: GAUGE
  
  - pattern: kafka.network<type=(.+), name=(.+), request=(.+)><>Value
    name: kafka_network_$1_$2
    type: GAUGE
    labels:
      request: "$3"
  
  - pattern: kafka.network<type=(.+), name=(.+)><>Value
    name: kafka_network_$1_$2
    type: GAUGE
  
  - pattern: kafka.controller<type=(.+), name=(.+)><>Value
    name: kafka_controller_$1_$2
    type: GAUGE
  
  - pattern: kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value
    name: kafka_log_$1_$2
    type: GAUGE
    labels:
      topic: "$3"
      partition: "$4"
  
  - pattern: kafka.log<type=(.+), name=(.+)><>Value
    name: kafka_log_$1_$2
    type: GAUGE
  
  - pattern: java.lang<type=(.+), name=(.+)><>(.+)
    name: java_lang_$1_$2_$3
    type: GAUGE
  
  - pattern: java.lang<type=(.+)><>(.+)
    name: java_lang_$1_$2
    type: GAUGE
